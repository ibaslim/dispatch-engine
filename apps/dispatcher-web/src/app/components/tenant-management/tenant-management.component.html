<app-page
  title="Tenant Management"
  containerClass="w-full px-6 py-6 bg-white dark:bg-[#1E201E] text-gray-900 dark:text-gray-100 min-h-[calc(100vh-4rem)]"
  contentClass="w-full"
>
  <div class="flex items-center justify-between mb-6">
    <div>
      <p class="text-sm text-gray-500">Manage users and roles for your tenant.</p>
    </div>

    <app-button
      variant="primary"
      label="+ Add New Tenant"
      (onClick)="openInviteDrawer()"
      [extraClasses]="'bg-[#3ddc97] text-black hover:bg-[#2fbf82] px-3 py-2 rounded-md text-sm'">
    </app-button>
  </div>

  <app-table
    [columns]="columns"
    [rows]="tenants"
    [columnTemplate]="'repeat(5, minmax(0, 1fr))'"
    [emptyTitle]="'No tenants found'"
    [emptySubtitle]="'Invite users to start collaborating'"
    (actionClick)="onTableActionClick($event)"
  >
  </app-table>
</app-page>

<!-- ── Add New Tenant Drawer ── -->
<app-side-drawer
  [open]="inviteDrawerOpen"
  size="large"
  title="Invite New User"
  subtitle="Send an invitation to a new team member."
  (closed)="closeInviteDrawer()"
>
  <!-- Body -->
  <div class="space-y-6">
    <div>
      <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
        Email address
      </label>
      <input
        type="email"
        [(ngModel)]="inviteEmail"
        placeholder="name@company.com"
        class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-[#2a2d2a]
               bg-white dark:bg-[#1E201E] text-gray-900 dark:text-gray-100
               focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
        Role
      </label>
      <select
        [(ngModel)]="inviteRole"
        class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-[#2a2d2a]
               bg-white dark:bg-[#1E201E] text-gray-900 dark:text-gray-100
               focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
      >
        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
      </select>
      <p class="text-xs text-gray-500 mt-2">Roles should match the backend enum.</p>
    </div>
  </div>

  <!-- Footer -->
  <div data-drawer-footer class="flex justify-end gap-2">
    <app-button
      variant="ghost"
      label="Cancel"
      (onClick)="closeInviteDrawer()"
    ></app-button>
    <app-button
      variant="primary"
      label="Send Invitation"
      (onClick)="sendInvitation()"
      [extraClasses]="'bg-[#3ddc97] text-black hover:bg-[#2fbf82]'"
    ></app-button>
  </div>
</app-side-drawer>

<!-- ── View User Drawer ── -->
<app-side-drawer
  [open]="viewDrawerOpen && !!selectedTenant"
  size="regular"
  title="User Details"
  subtitle="Read-only view of this tenant's account."
  (closed)="closeViewDrawer()"
>
  <!-- Body -->
  <div *ngIf="selectedTenant" class="space-y-4 text-sm">
    <div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">Name</p>
      <p class="text-base text-gray-900 dark:text-gray-100">{{ selectedTenant.name }}</p>
    </div>
    <div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">Email</p>
      <p class="text-base text-gray-900 dark:text-gray-100">{{ selectedTenant.email }}</p>
    </div>
    <div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">Role</p>
      <p class="text-base text-gray-900 dark:text-gray-100">{{ selectedTenant.role }}</p>
    </div>
    <div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">Status</p>
      <p class="text-base text-gray-900 dark:text-gray-100">{{ selectedTenant.status }}</p>
    </div>
    <div *ngIf="selectedTenant.phone">
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">Phone</p>
      <p class="text-base text-gray-900 dark:text-gray-100">{{ selectedTenant.phone }}</p>
    </div>
    <div *ngIf="selectedTenant.createdAt">
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-0.5">Created at</p>
      <p class="text-base text-gray-900 dark:text-gray-100">{{ selectedTenant.createdAt }}</p>
    </div>
  </div>

  <!-- Footer -->
  <div data-drawer-footer class="flex justify-end">
    <app-button
      variant="ghost-outline"
      label="Close"
      (onClick)="closeViewDrawer()"
    ></app-button>
  </div>
</app-side-drawer>
