<div class="w-full">
    <div class="flex items-center gap-1.5 mb-1">
        <span class="text-sm text-gray-600 dark:text-gray-200">{{ label }}</span>
        <span *ngIf="required" class="text-xs text-red-500">*</span>
    </div>

    <div class="flex items-stretch gap-2">
        <input class="flex-1 h-10 px-3 py-2 rounded-md border border-gray-300 dark:border-[#5a5d5a]
             bg-white dark:bg-[#1E201E] text-sm text-gray-900 dark:text-gray-100
             placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#3ddc97]/30"
            [class.hidden]="autocompleteReady"
            [placeholder]="placeholder" [required]="required" [pattern]="pattern" [attr.name]="getName()"
            [ngModel]="value" (ngModelChange)="onInput($event)" #model="ngModel" />

        <div #autocompleteHost class="autocomplete-host flex-1" [class.hidden]="!autocompleteReady"
            [class.pointer-events-none]="manualFallback" [class.opacity-50]="manualFallback"></div>

        <app-button variant="icon" type="button" ariaLabel="Open address in Google Maps" (onClick)="openInGoogleMaps()"
            [extraClasses]="'!w-auto !h-auto !p-0 bg-transparent'">
            <span class="h-10 w-10 rounded-md border border-gray-300 dark:border-[#5a5d5a]
         hover:bg-gray-100 dark:hover:bg-[#2a2d2a] transition flex items-center justify-center">
                <i class="ph ph-map-pin text-gray-700 dark:text-gray-200"></i>
            </span>
        </app-button>
    </div>

    <div *ngIf="manualFallback" class="mt-3 rounded-lg border border-amber-200 bg-amber-50 p-3 dark:border-amber-900/50 dark:bg-amber-950/20">
        <label class="block text-xs font-semibold text-amber-800 dark:text-amber-300">Manual {{ label }}</label>
        <input class="mt-1 h-10 w-full rounded-md border bg-white px-3 text-sm text-gray-900 outline-none focus:ring-2 dark:bg-[#1E201E] dark:text-gray-100"
            [class.border-emerald-400]="manualMatchedRegion"
            [class.border-red-400]="manualTouched && !manualMatchedRegion"
            [class.border-gray-300]="!manualTouched"
            [placeholder]="'Include an operational zone or city name'"
            [ngModel]="manualValue" (ngModelChange)="onManualInput($event)"
            [attr.name]="getName() + 'Manual'" />
        <p *ngIf="manualMatchedRegion" class="mt-1 text-xs text-emerald-700 dark:text-emerald-400">
            <i class="ph ph-check-circle"></i> Operational region matched: {{ manualMatchedRegion }}
        </p>
        <p *ngIf="manualTouched && !manualMatchedRegion" class="mt-1 text-xs text-red-600 dark:text-red-400">
            Address must include a configured operational-zone or city name.
        </p>
    </div>

    <app-error-message [show]="showError" [messages]="errorList"></app-error-message>
</div>
