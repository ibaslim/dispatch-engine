<label class="block w-full">
    <div *ngIf="showLabel" class="flex items-center gap-1.5 mb-1">
        <span class="text-sm text-gray-600 dark:text-gray-200">{{ label }}</span>
        <span *ngIf="required" class="text-xs text-red-500">*</span>
    </div>

    <div class="relative">
        <input
            class="w-full h-10 pl-3 pr-10 py-2 rounded-md border border-gray-300 dark:border-[#5a5d5a]
        bg-white dark:bg-[#1E201E] text-sm text-gray-900 dark:text-gray-100"
            [type]="visible ? 'text' : 'password'"
            [placeholder]="placeholder"
            [disabled]="disabled"
            [required]="required"
            [attr.minlength]="minlength ?? null"
            [attr.autocomplete]="autocomplete"
            [attr.name]="getName()"
            [(ngModel)]="value"
            (ngModelChange)="onInputValue($event)" />

        <button
            type="button"
            tabindex="-1"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
            [attr.aria-label]="visible ? 'Hide password' : 'Show password'"
            (click)="toggleVisibility()">
            <i class="ph" [ngClass]="visible ? 'ph-eye-slash' : 'ph-eye'"></i>
        </button>
    </div>

    <app-error-message [show]="showError" [messages]="errorList">
    </app-error-message>
</label>
