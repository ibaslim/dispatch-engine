<app-popup [open]="open" title="Get Directions" widthClass="max-w-md" (close)="onClose()">
    <div class="space-y-3">
        <button type="button"
            class="w-full flex items-center gap-3 rounded-lg border border-gray-200 dark:border-[#5a5d5a] px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-[#232623] transition"
            (click)="navigateToDirections('pickup')">
            <i class="ph ph-map-pin text-xl text-gray-700 dark:text-gray-200"></i>
            <div>
                <p class="font-medium text-gray-900 dark:text-gray-100">Navigate to Pickup</p>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ row?.pickupAddress }}</p>
            </div>
        </button>

        <button type="button"
            class="w-full flex items-center gap-3 rounded-lg border border-gray-200 dark:border-[#5a5d5a] px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-[#232623] transition"
            (click)="navigateToDirections('delivery')">
            <i class="ph ph-flag text-xl text-gray-700 dark:text-gray-200"></i>
            <div>
                <p class="font-medium text-gray-900 dark:text-gray-100">Navigate to Drop Location</p>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ row?.deliveryAddress }}</p>
            </div>
        </button>
    </div>
</app-popup>
