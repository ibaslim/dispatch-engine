<app-popup [open]="open" title="Report an Issue" widthClass="max-w-md" (close)="onClose()">
    <div class="flex flex-col gap-4 py-2">
        <p class="text-sm text-gray-500 dark:text-gray-400">
            Let us know what happened at {{ context?.stage === 'pickup' ? 'pickup' : 'delivery' }}{{ context?.orderNo ? ' for order ' + context?.orderNo : '' }}.
        </p>

        <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium text-gray-600 dark:text-gray-300">Reason</label>
            <select [(ngModel)]="reportReason"
                class="w-full rounded-md border border-gray-300 dark:border-[#3a3d3a] bg-white dark:bg-[#1E201E] text-sm px-3 py-2 text-gray-900 dark:text-gray-100">
                <option value="" disabled>Select a reason</option>
                <option *ngFor="let option of reportReasonOptions" [value]="option.value">{{ option.label }}</option>
            </select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium text-gray-600 dark:text-gray-300">
                Description {{ reportDescriptionRequired ? '(required)' : '(optional)' }}
            </label>
            <textarea [(ngModel)]="reportDescription" rows="3"
                class="w-full rounded-md border border-gray-300 dark:border-[#3a3d3a] bg-white dark:bg-[#1E201E] text-sm px-3 py-2 text-gray-900 dark:text-gray-100"
                placeholder="Add any extra detail..."></textarea>
        </div>

    </div>

    <div modal-footer class="flex items-center justify-end gap-3">
        <app-button variant="ghost-outline" label="Cancel" (onClick)="onClose()"></app-button>
        <app-button variant="ghost-success" label="Submit" [disabled]="!reportReason || reportSubmitting"
            (onClick)="submitReport()"></app-button>
    </div>
</app-popup>
