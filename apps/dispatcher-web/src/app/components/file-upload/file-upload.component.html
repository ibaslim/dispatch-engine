<div class="w-full">
    <label [attr.for]="inputId" class="relative flex cursor-pointer rounded-xl border-2 border-dashed p-5 transition-colors" [ngClass]="[
      layout === 'row' ? 'flex-col items-center gap-2 text-center sm:flex-row sm:items-center sm:gap-4 sm:text-left' : 'flex-col items-center gap-2 text-center',
      accent
        ? 'bg-indigo-50/40 border-indigo-200 hover:bg-indigo-50 dark:bg-indigo-500/5 dark:border-indigo-500/30 dark:hover:bg-indigo-500/10'
        : 'bg-gray-50 border-gray-300 hover:bg-gray-100 dark:bg-[#242624] dark:border-[#3a3d3a] dark:hover:bg-[#2a2d2a]'
    ]">
        <span class="absolute top-2.5 right-2.5 rounded px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide" [ngClass]="accent
        ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300'
        : 'bg-gray-100 text-gray-500 dark:bg-[#2a2d2a] dark:text-gray-400'">
            {{ required ? 'Required' : 'Optional' }}
        </span>

        <span class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-lg" [ngClass]="accent ? 'bg-indigo-100 dark:bg-indigo-500/10' : 'bg-gray-100 dark:bg-[#2a2d2a]'">
            <i class="ph {{ icon }} text-xl" [ngClass]="accent ? 'text-indigo-600 dark:text-indigo-400' : 'text-gray-600 dark:text-gray-300'"></i>
        </span>

        <span [ngClass]="layout === 'row' ? '' : ''">
            <span class="block text-sm font-semibold text-gray-900 dark:text-gray-100">{{ label }}</span>
            <span class="mt-0.5 block text-xs text-gray-500 dark:text-gray-400">{{ hint }}</span>
        </span>

        <span class="flex flex-col gap-1.5" [ngClass]="layout === 'row' ? 'items-center mt-1 sm:items-end sm:mt-0' : 'items-center mt-1'">
            <span class="inline-flex items-center gap-1.5 rounded-full border px-3 py-1 text-xs font-semibold" [ngClass]="accent
          ? 'border-indigo-200 bg-indigo-100/60 text-indigo-700 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-300'
          : 'border-gray-200 bg-gray-100 text-gray-700 dark:border-[#3a3d3a] dark:bg-[#2a2d2a] dark:text-gray-200'">
                <i class="ph ph-upload-simple"></i>
                Browse file
            </span>
            <span class="text-[11px] italic text-gray-400 dark:text-gray-500">
        {{ fileName || 'No file chosen' }}
      </span>
        </span>

        <input [id]="inputId" type="file" class="sr-only" [accept]="accept" [attr.name]="name || null" (change)="onChange($event)" />
    </label>

    <app-error-message [show]="errorList.length > 0" [messages]="errorList"></app-error-message>
</div>
