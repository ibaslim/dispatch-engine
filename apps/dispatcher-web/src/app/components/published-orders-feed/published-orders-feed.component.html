<div>
    <div *ngIf="publishedOrders.length > 0" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
        <app-offer-card *ngFor="let card of publishedOrders; trackBy: trackOffer" [card]="card"
            (accept)="acceptOrder(card)" (details)="openOfferDetails(card)">
        </app-offer-card>
    </div>

    <div *ngIf="publishedOrders.length === 0"
        class="rounded-xl border border-dashed border-gray-300 dark:border-[#3a3d3a] p-12 text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
        <p class="text-3xl mb-3">📭</p>
        <p class="font-medium text-lg">No new orders right now</p>
        <p class="mt-2">New orders published by the admin will appear here in real-time.</p>
    </div>

    <app-offer-details-modal [open]="!!selectedOfferId" [card]="selectedOffer"
        (close)="closeOfferDetails()" (accept)="acceptOrder($event)">
    </app-offer-details-modal>
</div>
