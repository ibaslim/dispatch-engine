<div class="w-full overflow-x-auto lg:overflow-visible transition-all duration-300" [ngClass]="{'pb-32': activeMenuRow}">
  <div
      class="min-w-[900px] lg:min-w-0 w-full border-t border-gray-200 dark:border-[#2a2d2a] bg-white dark:bg-[#1E201E] text-gray-800 dark:text-gray-200">

    <!-- HEADER -->
    <div class="grid items-center gap-4 px-4 py-3 text-[11px] uppercase tracking-wide text-gray-500 dark:text-gray-400"
        [style.gridTemplateColumns]="columnTemplate ? columnTemplate : ('repeat(' + columns.length + ', minmax(0, 1fr))')">
        <div *ngFor="let col of columns" class="items-center gap-2 w-full"
             [ngClass]="{
               'hidden sm:flex': col.hiddenOnMobile,
               'flex': !col.hiddenOnMobile,
               'justify-start text-left': col.align === 'left',
               'justify-center text-center': col.align === 'center' || !col.align,
               'justify-end text-right': col.align === 'right'
             }">
            <span>{{ col.label }}</span>

            <svg *ngIf="col.sortable" class="w-3 h-3 text-gray-400 dark:text-gray-500" viewBox="0 0 256 256"
                fill="currentColor">
                <path d="M128 40l48 48H80zM128 216l-48-48h96z"></path>
            </svg>
        </div>
    </div>

    <div class="border-t border-gray-200 dark:border-[#2a2d2a]"></div>

    <!-- ROWS -->
    <div *ngIf="rows.length > 0" class="divide-y divide-gray-200 dark:divide-[#2a2d2a]">

        <div *ngFor="let row of rows" class="grid items-center gap-4 px-4 py-3 text-sm"
            [ngClass]="activeMenuRow?.id === row.id ? 'relative z-40' : 'relative z-0'"
            [style.gridTemplateColumns]="columnTemplate ? columnTemplate : ('repeat(' + columns.length + ', minmax(0, 1fr))')">

            <div *ngFor="let col of columns" class="items-center w-full"
                 [ngClass]="{
                   'hidden sm:flex': col.hiddenOnMobile,
                   'flex': !col.hiddenOnMobile,
                   'justify-start text-left': col.align === 'left',
                   'justify-center text-center': col.align === 'center' || !col.align,
                   'justify-end text-right': col.align === 'right'
                 }">

                <ng-container [ngSwitch]="col.key">

                    <!-- SELECT -->
                    <ng-container *ngSwitchCase="'select'">
                        <input type="checkbox" class="h-4 w-4 accent-[#3ddc97]" />
                    </ng-container>

                    <!-- READY FOR PICKUP TOGGLE -->
                    <ng-container *ngSwitchCase="'readyForPickup'">
                        <app-toggle-button [value]="row.readyForPickup"
                            (valueChange)="readyForPickupChange.emit({ id: row.id, value: $event })">
                        </app-toggle-button>
                    </ng-container>

                    <!-- DRIVER COLUMN -->
                    <ng-container *ngSwitchCase="'driver'">
                        <div class="flex items-center justify-center w-full">

                            <span *ngIf="row.driver; else assignBtn">
                                {{ row.driver }}
                            </span>

                            <ng-template #assignBtn>
                                <app-button variant="ghost-outline" label="+ Assign"
                                    (onClick)="onAssignClick(row, $event)"></app-button>
                            </ng-template>

                        </div>
                    </ng-container>

                    <!-- ACTIVITY STATUS -->
                    <ng-container *ngSwitchCase="'activityStatus'">
                        <div class="flex items-center justify-center gap-1.5 w-full">
                            <ng-container *ngIf="row.activityStatusAction; else activityStatusText">
                                <app-button variant="ghost-success" [label]="row.activityStatusAction"
                                    (onClick)="onActivityStatusClick(row, $event)"></app-button>
                            </ng-container>
                            <ng-template #activityStatusText>
                                <span>{{ row.activityStatusLabel || row.activityStatus }}</span>
                            </ng-template>

                            <app-button *ngIf="row.canReportIncident" variant="icon"
                                [title]="row.incidentAlreadyReported ? 'Issue already reported' : 'Report an issue'"
                                [ariaLabel]="row.incidentAlreadyReported ? 'Issue already reported' : 'Report an issue'"
                                class="rounded-md hover:bg-amber-50 dark:hover:bg-amber-900/20 transition"
                                (onClick)="onReportIncidentClick(row, $event)">
                                <i class="ph ph-warning-circle text-lg"
                                    [ngClass]="row.incidentAlreadyReported ? 'text-red-500' : 'text-amber-500'"></i>
                            </app-button>
                        </div>
                    </ng-container>

                    <!-- DIRECTIONS -->
                    <ng-container *ngSwitchCase="'directions'">
                        <div class="flex items-center justify-center w-full" *ngIf="row.showDirections; else noDirections">
                            <app-button variant="icon" ariaLabel="Directions"
                                class="rounded-md hover:bg-gray-100 dark:hover:bg-[#2a2d2a] transition"
                                (onClick)="onDirectionsIconClick(row, $event)">
                                <i class="ph ph-navigation-arrow text-xl text-gray-900 dark:text-gray-200"></i>
                            </app-button>
                        </div>
                        <ng-template #noDirections>
                            <span>-</span>
                        </ng-template>
                    </ng-container>

                    <!-- REPORTED ISSUE -->
                    <ng-container *ngSwitchCase="'incidentReport'">
                        <div class="flex flex-col items-start w-full text-left" *ngIf="row.incidentReportSummary; else noIncident">
                            <span class="text-[10px] uppercase tracking-wide text-amber-600 dark:text-amber-400 font-semibold">{{ row.incidentReportStage }}</span>
                            <span class="text-xs text-gray-700 dark:text-gray-300">{{ row.incidentReportSummary }}</span>
                        </div>
                        <ng-template #noIncident>
                            <span>-</span>
                        </ng-template>
                    </ng-container>

                    <!-- STATUS -->
                    <ng-container *ngSwitchCase="'status'">
                        <span
                            class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                            [ngClass]="getStatusBadgeClasses(row[col.key])">
                            {{ row[col.key] }}
                        </span>
                    </ng-container>

                    <!-- ACTIONS -->
                    <ng-container *ngSwitchCase="'actions'">
                        <div class="relative flex justify-center w-full">

                            <app-button variant="icon"
                                class="row-action-button group rounded-md hover:bg-gray-100 dark:hover:bg-[#2a2d2a] transition"
                                (onClick)="onActionClick(row, $event)" [ariaLabel]="actionLabel">
                                <i
                                    class="ph text-xl text-gray-900 dark:text-gray-200 transition-transform duration-150 group-hover:scale-125"
                                    [ngClass]="actionIcon === 'eye' ? 'ph-eye' : 'ph-dots-three'"></i>
                            </app-button>

                            <app-menu [items]="menuItems" [visible]="activeMenuRow?.id === row.id"
                                (select)="menuSelect.emit({ item: $event, row })">
                            </app-menu>

                        </div>
                    </ng-container>

                    <!-- NAME -->
                    <ng-container *ngSwitchCase="'name'">
                        <div class="flex items-center gap-3 w-full"
                             [ngClass]="{
                               'justify-start': col.align === 'left',
                               'justify-center': col.align === 'center' || !col.align,
                               'justify-end': col.align === 'right'
                             }">
                            <div
                                class="w-7 h-7 rounded-full bg-gray-300 dark:bg-[#3a3a3a] text-gray-800 dark:text-gray-100 text-xs items-center justify-center font-semibold hidden sm:flex">
                                {{ getInitials(row.name) }}
                            </div>
                            <span>{{ row.name }}</span>
                        </div>
                    </ng-container>

                    <!-- DEFAULT -->
                    <ng-container *ngSwitchDefault>
                        {{ row[col.key] }}
                    </ng-container>

                </ng-container>

            </div>
        </div>

    </div>

  </div>
  
  <!-- EMPTY STATE (Moved outside min-w wrapper) -->
  <div *ngIf="rows.length === 0"
      class="w-full py-24 flex flex-col items-center text-center text-gray-500 dark:text-gray-400 sticky left-0 right-0">
      <div class="w-12 h-12 rounded-full bg-green-100 dark:bg-[#143628] flex items-center justify-center mb-3">
          <svg class="w-6 h-6 text-[#3ddc97]" viewBox="0 0 256 256" fill="currentColor">
              <path
                  d="M208 40H64a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16zm0 160H64V56h144zM96 104h64a8 8 0 0 1 0 16H96a8 8 0 0 1 0-16zm0 32h64a8 8 0 0 1 0 16H96a8 8 0 0 1 0-16z">
              </path>
          </svg>
      </div>

      <div class="text-sm">{{ emptyTitle }}</div>

      <div *ngIf="emptySubtitle" class="text-xs text-gray-400 dark:text-gray-500 mt-1">
          {{ emptySubtitle }}
      </div>
  </div>

</div>
