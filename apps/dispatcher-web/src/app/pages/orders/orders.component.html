<app-page title="Orders" titleClass="text-2xl font-semibold text-gray-900 dark:text-gray-100"
    containerClass="w-full px-4 py-8 sm:px-6 lg:px-8 bg-white dark:bg-[#1E201E] text-gray-900 dark:text-gray-100 min-h-[calc(100vh-4rem)]"
    contentClass="w-full space-y-6">

    <!-- PAGE ACTIONS -->
    <div page-actions
        class="flex flex-col-reverse items-stretch gap-2 w-full xs:flex-row xs:items-center xs:justify-end sm:w-auto">
        <app-search-bar [value]="searchQuery" (valueChange)="searchQuery = $event"
            class="w-full xs:w-auto" containerClass="w-full xs:w-56"></app-search-bar>

        <app-button *ngIf="!isReadOnlyTenant" variant="primary" label="+ New order" (onClick)="openNewOrder()"
            [extraClasses]="'bg-[#3ddc97] text-black hover:bg-[#2fbf82] px-3 py-2 rounded-md text-sm whitespace-nowrap flex-shrink-0 w-full xs:w-auto'">
        </app-button>
    </div>

    <!-- FEEDBACK -->
    <p *ngIf="feedbackMessage" [class]="'text-sm ' +
        (feedbackTone === 'error'
          ? 'text-red-600 dark:text-red-400'
          : feedbackTone === 'success'
          ? 'text-green-700 dark:text-green-400'
          : 'text-gray-600 dark:text-gray-300')">
        {{ feedbackMessage }}
    </p>

    <!-- TABS -->
    <div class="flex items-center gap-6 text-sm text-gray-500 dark:text-gray-400 border-b border-gray-200 dark:border-[#2a2d2a] pb-2 mt-2 overflow-x-auto whitespace-nowrap scrollbar-none">
        <app-button *ngFor="let tab of tabs" variant="tab" [label]="tab" (onClick)="setActiveTab(tab)"
            [extraClasses]="(
                tab === 'Unassigned' && hasUnassignedOrders
                    ? 'text-red-600 dark:text-red-400 border-b-2 border-red-600 dark:border-red-400'
                    : activeTab === tab
                        ? 'text-[#3ddc97] border-b-2 border-[#3ddc97]'
                        : 'text-gray-500'
            ) + ' whitespace-nowrap'">
        </app-button>
    </div>

    <!-- NEW ORDERS TAB (Drivers only) -->
    <app-published-orders-feed *ngIf="isDriver" [hidden]="activeTab !== 'New Orders'"
        (accepted)="onOrderAccepted($event)" (refresh)="loadOrders()">
    </app-published-orders-feed>

    <!-- TABLE -->
    <app-table *ngIf="activeTab !== 'New Orders'" [columns]="columns" [rows]="rows" [emptyTitle]="emptyTitle" [emptySubtitle]="emptySubtitle"
        [activeMenuRow]="activeMenuRow" [menuItems]="getContextMenuItems()"
        (actionClick)="toggleMenu($event)"
        (assignClick)="openAssignDriver($event)"
        (menuSelect)="handleMenuAction($event.item, $event.row)"
        (readyForPickupChange)="updateReadyForPickupFromRow($event.id, $event.value)"
        (activityStatusAction)="onActivityStatusAction($event)"
        (directionsClick)="openDirections($event)"
        (reportIncidentClick)="openReportModal($event)">
    </app-table>


    <!-- ───────────────────────────────────────────
         NEW ORDER MODAL
    ─────────────────────────────────────────── -->
    <app-popup *ngIf="!isReadOnlyTenant" [open]="isNewOrderOpen" title="New Order" (close)="closeNewOrder()">

        <app-new-order-form *ngIf="isNewOrderOpen"
            [value]="newOrderValue"
            (valueChange)="newOrderValue = $event"
            (pinPickup)="onPickupPin()"
            (pinDelivery)="onDeliveryPin()"
            [showSubmitValidation]="formSubmitted()">
        </app-new-order-form>

        <div modal-footer class="flex flex-col items-stretch xs:flex-row flex-wrap xs:items-center justify-end gap-3">
            <app-button *ngIf="showLocalDemoButton" variant="ghost-success" label="Fill Demo Data"
                [disabled]="isSavingOrder"
                        [extraClasses]="'w-full xs:w-auto'"
                (onClick)="fillNewOrderWithDummyData()">
            </app-button>

            <app-button variant="ghost" label="Cancel" (onClick)="closeNewOrder()"
                [extraClasses]="'border border-gray-300 dark:border-[#5a5d5a] text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#2a2d2a] px-4 py-2 rounded-md text-sm w-full xs:w-auto'">
            </app-button>

            <app-button variant="ghost" label="Save Order" (onClick)="saveNewOrder()"
                [loading]="isSavingOrder" [disabled]="isPublishingOrder"
                [extraClasses]="'border border-gray-300 dark:border-[#5a5d5a] text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#2a2d2a] px-4 py-2 rounded-md text-sm w-full xs:w-auto'">
            </app-button>

            <app-button variant="primary" label="Publish Order" (onClick)="publishNewOrder()"
                [loading]="isPublishingOrder" [disabled]="isSavingOrder"
                [extraClasses]="'bg-[#3ddc97] text-black hover:bg-[#2fbf82] px-6 py-2 rounded-md text-sm  gap-2 w-full xs:w-auto'">
            </app-button>
        </div>
    </app-popup>

    <!-- ASSIGN DRIVER MODAL -->
    <app-assign-driver-modal *ngIf="!isReadOnlyTenant" [open]="isAssignDriverOpen" [order]="selectedOrderForAssignment"
        (close)="closeAssignDriver()" (assigned)="onDriverAssigned()" (unassigned)="onDriverUnassigned()">
    </app-assign-driver-modal>

    <!-- DIRECTIONS MODAL -->
    <app-directions-modal [open]="isDirectionsOpen" [row]="selectedRowForDirections" (close)="closeDirections()">
    </app-directions-modal>

    <!-- QR SCAN MODAL -->
    <app-qr-scan-modal [open]="isQrScanOpen" [context]="qrScanContext"
        (close)="closeQrScanModal()" (matched)="onQrMatched($event)">
    </app-qr-scan-modal>

    <!-- REPORT ISSUE MODAL -->
    <app-report-incident-modal [open]="isReportOpen" [context]="reportContext" (close)="closeReportModal()">
    </app-report-incident-modal>

    <!-- PROOF OF DELIVERY MODAL -->
    <app-pod-capture-modal [open]="isPodOpen" [context]="podContext"
        (close)="closePodModal()" (delivered)="onPodDelivered($event)">
    </app-pod-capture-modal>

    <!-- ORDER DETAILS MODAL -->
    <app-order-details-modal [open]="isDetailsOpen" [order]="selectedOrderForDetails" [isReadOnlyTenant]="isReadOnlyTenant" [isDriver]="isDriver"
        [readyForPickup]="selectedOrderReadyForPickup"
        (close)="closeDetails()" (menuAction)="handleDetailsMenu($event)" (readyForPickupChange)="updateReadyForPickup($event)">
    </app-order-details-modal>

    <!-- PRINT ORDER MODAL -->
    <app-print-order-modal [open]="isPrintOpen" [order]="selectedOrderForPrint" (close)="closePrintOrder()">
    </app-print-order-modal>

    <!-- SHIPPING LABEL MODAL -->
    <app-shipping-label-modal [open]="isLabelOpen" [order]="selectedOrderForLabel" (close)="closePrintLabel()">
    </app-shipping-label-modal>

</app-page>
