<div class="flex flex-col min-h-screen bg-gray-50 dark:bg-[#181a18]">

  <!-- Page Header -->
  <div class="bg-white dark:bg-[#1E201E] border-b border-gray-200 dark:border-[#2a2d2a] px-6 pt-6 pb-0">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Configurations</h1>

    <!-- Sub-tabs -->
    <nav class="configuration-tabs flex gap-1 overflow-x-auto" aria-label="Configurations tabs">
      <a
        routerLink="operational-regions"
        routerLinkActive
        #regionsTab="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="regionsTab.isActive
          ? 'text-[#3ddc97] border-[#3ddc97]'
          : 'text-gray-500 dark:text-gray-400 border-transparent hover:text-gray-900 dark:hover:text-white'"
        class="px-4 py-2.5 text-sm font-medium border-b-2
               transition-colors duration-150 -mb-px"
        id="tab-operational-regions"
      >
        Operational Regions
      </a>
      <a routerLink="delivery-categories" routerLinkActive #categoriesTab="routerLinkActive"
        [ngClass]="categoriesTab.isActive ? 'text-[#3ddc97] border-[#3ddc97]' : 'text-gray-500 dark:text-gray-400 border-transparent hover:text-gray-900 dark:hover:text-white'"
        class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors duration-150 -mb-px whitespace-nowrap">
        Delivery Categories
      </a>
      <a routerLink="after-hours" routerLinkActive #afterHoursTab="routerLinkActive"
        [ngClass]="afterHoursTab.isActive ? 'text-[#3ddc97] border-[#3ddc97]' : 'text-gray-500 dark:text-gray-400 border-transparent hover:text-gray-900 dark:hover:text-white'"
        class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors duration-150 -mb-px whitespace-nowrap">
        After Hours
      </a>
      <a routerLink="base-prices" routerLinkActive #basePricesTab="routerLinkActive"
        [ngClass]="basePricesTab.isActive ? 'text-[#3ddc97] border-[#3ddc97]' : 'text-gray-500 dark:text-gray-400 border-transparent hover:text-gray-900 dark:hover:text-white'"
        class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors duration-150 -mb-px whitespace-nowrap">
        Base Prices
      </a>
      <a routerLink="surcharges" routerLinkActive #surchargesTab="routerLinkActive"
        [ngClass]="surchargesTab.isActive ? 'text-[#3ddc97] border-[#3ddc97]' : 'text-gray-500 dark:text-gray-400 border-transparent hover:text-gray-900 dark:hover:text-white'"
        class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors duration-150 -mb-px whitespace-nowrap">
        Surcharges
      </a>
      <a
        routerLink="driver-payroll"
        routerLinkActive
        #driverPayrollTab="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="driverPayrollTab.isActive
          ? 'text-[#3ddc97] border-[#3ddc97]'
          : 'text-gray-500 dark:text-gray-400 border-transparent hover:text-gray-900 dark:hover:text-white'"
        class="px-4 py-2.5 text-sm font-medium border-b-2
               transition-colors duration-150 -mb-px"
        id="tab-driver-payroll"
      >
        Driver Payments
      </a>
    </nav>
  </div>

  <!-- Routed tab content -->
  <div class="flex-1">
    <router-outlet></router-outlet>
  </div>
</div>
