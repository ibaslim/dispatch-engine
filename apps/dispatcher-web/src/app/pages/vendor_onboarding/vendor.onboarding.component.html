<app-page
  containerClass="w-full px-4 py-10 sm:px-6 lg:px-8 bg-gray-50 dark:bg-[#17181a] text-gray-900 dark:text-gray-100 min-h-screen"
  contentClass="w-full">
  <app-onboarding-form
    title="Vendor Registration"
    subtitle="Fill in your information and upload the required documents to complete your registration."
    [form]="form"
    [showSubmitValidation]="showSubmitValidation"
    [emailError]="emailError"
    [submitMessage]="submitMessage"
    (onSubmit)="applyForApproval()"
    (formChange)="form = $event">

    <app-base-input
      label="Business Number"
      [required]="true"
      [value]="form.businessNumber || ''"
      [pattern]="'^[A-Za-z0-9]{15}$'"
      [errorMessages]="{ pattern: 'Business number must be 15 alphanumeric characters.' }"
      [showSubmitValidation]="showSubmitValidation"
      (valueChange)="form.businessNumber = $event">
    </app-base-input>

    <div class="md:col-span-2">
      <div class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">
        Document Uploads
      </div>
      <app-file-upload
        label="Citizen Card / Driving License Scan"
        hint="JPG, PNG or PDF · Max 10MB"
        icon="ph-identification-card"
        [required]="true"
        [fileName]="form.nationalIdFile?.name || null"
        [error]="nationalIdFileError"
        [showSubmitValidation]="showSubmitValidation"
        missingMessage="Citizen card / driving license scan is required."
        (fileChange)="onNationalIdChange($event)">
      </app-file-upload>
    </div>

    <div class="md:col-span-2 h-px bg-gray-200 dark:bg-[#2a2d2a] my-1"></div>
  </app-onboarding-form>
</app-page>
