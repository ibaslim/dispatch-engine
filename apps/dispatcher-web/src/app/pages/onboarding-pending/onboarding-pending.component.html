<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-[#121412] dark:to-[#1a1c1a]">
  <div class="max-w-md w-full space-y-8 p-8 bg-white dark:bg-[#1E201E] rounded-xl shadow-lg text-center border border-gray-100 dark:border-[#2a2d2a]">
    <div class="space-y-4">
      <div class="flex justify-center mb-4">
        <div class="text-5xl animate-pulse">⏳</div>
      </div>
      
      <h2 class="text-3xl font-bold text-gray-900 dark:text-gray-100">
        Application Pending
      </h2>
      
      <p class="text-gray-600 dark:text-gray-400 text-base leading-relaxed">
        {{ statusMessage }}
      </p>
      
      <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800/30 rounded-lg p-4 mt-6">
        <p class="text-sm text-blue-800 dark:text-blue-300">
          <strong>Under Review:</strong> Our team is currently reviewing your application. You'll receive an email once a decision has been made.
        </p>
      </div>
    </div>

    <div class="pt-4 flex flex-col gap-3">
      <app-button
        variant="primary"
        [label]="isChecking ? 'Checking…' : 'Refresh Status'"
        [disabled]="isChecking"
        (onClick)="refreshStatus()"
        [extraClasses]="'w-full py-2.5 rounded-lg text-sm font-medium shadow-sm shadow-emerald-500/20'"
      ></app-button>
    </div>
  </div>
</div>
