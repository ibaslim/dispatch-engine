<app-page
  title="Pending Approval"
  subtitle="Your onboarding application is under review."
  containerClass="w-full px-4 py-10 sm:px-6 lg:px-8 bg-white dark:bg-[#1E201E] text-gray-900 dark:text-gray-100 min-h-screen"
  contentClass="w-full"
>
  <div class="max-w-xl mx-auto border border-gray-200 dark:border-[#2a2d2a] rounded-lg p-6 space-y-4">
    <p class="text-sm text-gray-600 dark:text-gray-300">
      {{ statusMessage }}
    </p>
    <app-button
      variant="primary"
      [label]="isChecking ? 'Checking…' : 'Refresh status'"
      [disabled]="isChecking"
      (onClick)="refreshStatus()"
      [extraClasses]="'px-5 py-2 rounded-md text-sm'"
    ></app-button>
  </div>
</app-page>
