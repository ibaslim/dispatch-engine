<app-page
  containerClass="w-full px-4 py-10 sm:px-6 lg:px-8 bg-gray-50 dark:bg-[#17181a] text-gray-900 dark:text-gray-100 min-h-screen"
  contentClass="w-full">
  <app-onboarding-form
    title="Driver Registration"
    subtitle="Fill in your information and upload the required documents to complete your registration."
    [form]="form"
    [showSubmitValidation]="showSubmitValidation"
    [emailError]="emailError"
    [submitMessage]="submitMessage"
    (onSubmit)="applyForApproval()"
    (formChange)="form = $event">

    <div class="md:col-span-2 text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
      Document Uploads
    </div>

      <app-file-upload
        label="Profile Picture"
        hint="JPG or PNG · Max 10MB"
        icon="ph-user"
        [required]="true"
        [fileName]="form.profilePictureFile?.name || null"
        [error]="profilePictureError"
        [showSubmitValidation]="showSubmitValidation"
        missingMessage="Profile picture is required."
        (fileChange)="onProfilePictureChange($event)">
      </app-file-upload>

      <app-file-upload
        label="Photo ID"
        hint="PR Card or any official ID with photo · IMG or PDF · Max 10MB"
        icon="ph-identification-card"
        [required]="true"
        [fileName]="form.photoIdFile?.name || null"
        [error]="photoIdFileError"
        [showSubmitValidation]="showSubmitValidation"
        missingMessage="Photo ID is required."
        (fileChange)="onPhotoIdChange($event)">
      </app-file-upload>

    <app-file-upload
      label="Passport Scan"
      hint="JPG, PNG or PDF · Max 10MB"
      icon="ph-book-open"
      [required]="true"
      [fileName]="form.passportFile?.name || null"
      [error]="passportFileError"
      [showSubmitValidation]="showSubmitValidation"
      missingMessage="Passport scan is required."
      (fileChange)="onPassportChange($event)">
    </app-file-upload>

    <app-file-upload
      label="Police Verification Certificate"
      hint="JPG, PNG or PDF · Max 10MB"
      icon="ph-shield-check"
      [required]="true"
      [fileName]="form.policeVerificationFile?.name || null"
      [error]="policeVerificationFileError"
      [showSubmitValidation]="showSubmitValidation"
      missingMessage="Police verification certificate is required."
      (fileChange)="onPoliceVerificationChange($event)">
    </app-file-upload>

    <app-file-upload
      label="Driving License Scan"
      hint="JPG, PNG or PDF · Max 10MB"
      icon="ph-identification-card"
      [required]="true"
      [fileName]="form.licenseFile?.name || null"
      [error]="licenseFileError"
      [showSubmitValidation]="showSubmitValidation"
      missingMessage="Driving license scan is required."
      (fileChange)="onLicenseChange($event)">
    </app-file-upload>

    <app-file-upload
      label="Driving History Report"
      hint="JPG, PNG or PDF · Max 10MB"
      icon="ph-file-text"
      [required]="true"
      [fileName]="form.drivingHistoryFile?.name || null"
      [error]="drivingHistoryFileError"
      [showSubmitValidation]="showSubmitValidation"
      missingMessage="Driving history report is required."
      (fileChange)="onDrivingHistoryChange($event)">
    </app-file-upload>

    <div class="md:col-span-2 h-px bg-gray-200 dark:bg-[#2a2d2a] my-1"></div>
  </app-onboarding-form>
</app-page>
